<title>KETSUP 데모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: 상단 데모 바 + 사용자 앱(모바일 프레임) / 어드민 콘솔(1440 기준 반응형) 전환. 토큰은 Figma Foundations(Primitive→Semantic)와 동일 값. */
:root{
  --primary:#3A7EFF; --primary-surface:#EBF2FF; --primary-surface-2:rgba(58,126,255,.08);
  --ink:#262C31; --body:#5A636A; --muted:#778088; --muted-soft:#ADB4BA;
  --canvas:#FFFFFF; --soft:#F4F6F6; --hover:#F8F9FB; --hairline:#ECEDF0; --border:#DBDDDF;
  --success:#48C45E; --success-text:#16A36A; --success-surface:#EDF9EF;
  --danger:#F24147; --danger-surface:#FDECEC;
  --caution-text:#B8960A; --caution-surface:#FFFBE3;
  --orange:#E57834; --orange-surface:#FFF4EA; --cyan:#66CCCC;
  --stage:#E9EDF5;
  --sp-4:4px; --sp-8:8px; --sp-10:10px; --sp-12:12px; --sp-14:14px; --sp-16:16px; --sp-20:20px;
  --r-xs:4px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px; --r-full:999px;
  --shadow-subtle:0 1px 2px rgba(0,0,0,.05); --shadow-raised:0 4px 10px rgba(0,0,0,.10); --shadow-float:0 4px 40px rgba(77,35,57,.14);
  --font:"Pretendard","Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-inline:16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.shell{max-width:1480px;margin-inline:auto;padding-block:16px 32px;display:flex;flex-direction:column;gap:16px;min-height:100%}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--canvas);border-radius:var(--r-lg);padding:10px 14px;box-shadow:var(--shadow-subtle)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin-right:auto}
.logo{width:28px;height:28px;border-radius:var(--r-sm);background:var(--primary);display:grid;place-items:center;color:#fff}
.seg{display:flex;background:var(--soft);border-radius:var(--r-md);padding:3px;gap:2px}
.seg button{padding:8px 16px;border-radius:var(--r-sm);font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--canvas);color:var(--primary);box-shadow:var(--shadow-subtle)}
.bar select{border:1px solid var(--border);border-radius:var(--r-md);padding:8px 12px;background:var(--canvas);max-width:100%}
.ghost{padding:8px 14px;border-radius:var(--r-md);border:1px solid var(--border);font-weight:600;background:var(--canvas)}
#stage{flex:1;display:flex;justify-content:center;align-items:flex-start;min-width:0}
.note{color:var(--muted);font-size:12px;text-align:center}

/* ---------- 사용자 앱 ---------- */
.phone{width:min(390px,100%);height:min(844px,calc(100dvh - 150px));min-height:620px;background:var(--canvas);border-radius:32px;box-shadow:0 0 0 8px #1b2026,var(--shadow-float);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media(max-width:480px){.phone{border-radius:20px;box-shadow:0 0 0 4px #1b2026}}
.sbar{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-weight:600;font-size:14px;position:relative;z-index:3}
.sbar i{display:flex;gap:5px}.sbar i b{display:block;height:9px;border-radius:2px;background:var(--ink)}
.sbar i b:nth-child(1){width:14px}.sbar i b:nth-child(2){width:12px}.sbar i b:nth-child(3){width:22px;height:11px;border-radius:3px}
.view{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;display:flex;flex-direction:column}
.view.grad{background:linear-gradient(180deg,#ECF3FF 0,#fff 45%)}
.view.grad2{background:linear-gradient(180deg,#E7EEFE 0,#FDF9DE 22%,#fff 40%)}
.pad{padding-inline:20px}
.nav{flex:none;display:flex;justify-content:space-between;padding:8px 16px 14px;background:var(--canvas);border-top:1px solid var(--hairline)}
.nav button{width:62px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted-soft);font-size:11px;font-weight:500;padding:4px 0}
.nav button[aria-current=true]{color:var(--primary);font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-weight:700;font-size:16px;min-height:50px}
.top .ib{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r-full)}
.h1{font-size:28px;line-height:1.4;font-weight:700;letter-spacing:-.01em}
.h2{font-size:20px;line-height:1.4;font-weight:600}
.h3{font-size:18px;line-height:1.4;font-weight:600}
.t-title{font-size:16px;font-weight:700;line-height:1.55}
.t-body{font-size:15px;color:var(--body);line-height:1.5}
.t-sm{font-size:13px;color:var(--body)}
.t-cap{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}.pri{color:var(--primary)}
.stack{display:flex;flex-direction:column}.row{display:flex;align-items:center}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}.g16{gap:16px}.g20{gap:20px}
.sb{justify-content:space-between}.grow{flex:1;min-width:0}.center{text-align:center;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 10px;border-radius:var(--r-md);font-weight:700;font-size:15px;line-height:1.35;border:1px solid transparent;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--primary);color:#fff}.btn.s{background:var(--canvas);border-color:var(--border);color:var(--ink)}
.btn.soft{background:var(--primary-surface);color:var(--primary)}.btn.d{background:var(--danger);color:#fff}
.btn.off{background:var(--hairline);color:var(--muted-soft);pointer-events:none}
.btn.sm{width:auto;padding:9px 14px;font-size:13px;border-radius:var(--r-sm)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:var(--r-full);font-size:13px;font-weight:600;background:var(--primary-surface);color:var(--primary);white-space:nowrap}
.chip.sel{background:var(--primary);color:#fff}.chip.gray{background:var(--soft);color:var(--body)}
.chip.or{background:var(--orange-surface);color:var(--orange)}.chip.gr{background:var(--success-surface);color:var(--success-text)}
.chip.rd{background:var(--danger-surface);color:var(--danger)}.chip.ye{background:var(--caution-surface);color:var(--caution-text)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.chips.scroll::-webkit-scrollbar{display:none}
.card{background:var(--canvas);border-radius:var(--r-lg);box-shadow:var(--shadow-raised);padding:16px}
.card.flat{box-shadow:none;border:1px solid var(--hairline)}
.tile{background:var(--hover);border-radius:var(--r-md);padding:12px 14px}
.ibox{display:grid;place-items:center;flex:none;border-radius:var(--r-md)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:500;color:var(--body)}
.field .in{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--canvas);border-radius:var(--r-md);padding:0 14px}
.field input,.field select,.field textarea{border:0;outline:0;background:none;flex:1;min-width:0;padding:14px 0;font-size:15px}
.field .in:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-surface-2)}
.field.err .in{border-color:var(--danger)}.field .help{font-size:12px;color:var(--muted)}.field.err .help{color:var(--danger)}
.opt{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r-lg);border:1px solid var(--hairline);background:var(--canvas);box-shadow:var(--shadow-subtle);text-align:left;width:100%}
.opt .bd{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--body);font-weight:700;font-size:13px;flex:none}
.opt[aria-pressed=true]{background:var(--primary-surface);border:2px solid var(--primary);padding:15px}
.opt[aria-pressed=true] .bd{background:var(--primary);color:#fff}
.opt.ok{background:var(--success-surface);border:2px solid var(--success);padding:15px}.opt.ok .bd{background:var(--success);color:#fff}
.opt.no{background:var(--danger-surface);border:2px solid var(--danger);padding:15px}.opt.no .bd{background:var(--danger);color:#fff}
.bar-t{height:6px;border-radius:99px;background:var(--hairline);overflow:hidden}.bar-t i{display:block;height:100%;background:var(--primary);border-radius:99px}
.div{height:1px;background:var(--hairline)}
.spacer{flex:1}
.foot{padding:12px 20px 24px;display:flex;flex-direction:column;gap:10px;flex:none}
.scrim{position:absolute;inset:0;background:rgba(13,18,26,.5);z-index:10;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--canvas);border-radius:24px 24px 0 0;padding:10px 20px 28px;z-index:11;transform:translateY(105%);transition:transform .25s;box-shadow:var(--shadow-float);display:flex;flex-direction:column;gap:14px}
.sheet::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--border);align-self:center}
.open>.scrim{opacity:1;pointer-events:auto}.open>.sheet{transform:none}
.toast{position:absolute;left:20px;right:20px;bottom:90px;background:rgba(0,0,0,.85);color:#fff;border-radius:var(--r-md);padding:12px 16px;font-size:13px;z-index:20;animation:fade 2.2s forwards}
@keyframes fade{0%{opacity:0;transform:translateY(8px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
.wave{display:flex;align-items:center;gap:4px;height:36px}.wave i{width:4px;border-radius:2px;background:var(--primary);animation:wv 1s ease-in-out infinite}
.wave i:nth-child(odd){animation-delay:.15s}.wave i:nth-child(3n){animation-delay:.3s}
@keyframes wv{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.still .wave i{animation:none}
.micw{position:relative;width:132px;height:132px;display:grid;place-items:center}
.micw::before,.micw::after{content:"";position:absolute;border-radius:50%;background:rgba(58,126,255,.12)}
.micw::before{inset:0}.micw::after{inset:18px;background:rgba(58,126,255,.18)}
.micw.live::before{animation:pulse 1.6s infinite}
@keyframes pulse{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.15);opacity:0}}
.micw button{position:relative;z-index:1;width:72px;height:72px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow-raised)}
.hl{background:rgba(102,204,204,.28);border-radius:4px;padding:1px 4px;cursor:pointer}
.cover{border-radius:8px;position:relative;overflow:hidden;flex:none;box-shadow:0 4px 10px rgba(0,0,0,.18)}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:rgba(255,255,255,.25)}
.cover::after{content:"";position:absolute;right:-30%;bottom:-20%;width:90%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.18)}
.cover b{position:absolute;left:18%;top:12%;width:26%;aspect-ratio:1;border-radius:50%;background:#FFF195;opacity:.9}
.ring{--v:87;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--primary) calc(var(--v)*1%),var(--hairline) 0);display:grid;place-items:center;flex:none}
.ring span{width:74px;height:74px;border-radius:50%;background:var(--primary-surface);display:grid;place-items:center;text-align:center;font-weight:700;color:var(--primary);font-size:20px;line-height:1.1}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--hairline)}.dots i.on{background:var(--success)}.dots i.cur{background:var(--primary);width:20px;border-radius:5px}
.switch{width:44px;height:26px;border-radius:99px;background:var(--border);position:relative;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch[aria-checked=true]{background:var(--primary)}.switch[aria-checked=true]::after{left:21px}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--hairline);padding-inline:20px}
.tabs button{padding:10px 0;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--primary);border-color:var(--primary)}

/* ---------- 어드민 ---------- */
.admin{width:100%;display:grid;grid-template-columns:232px minmax(0,1fr);background:var(--hover);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-raised);min-height:min(1000px,calc(100dvh - 130px))}
.side{background:var(--canvas);border-right:1px solid var(--hairline);padding:25px 9px 24px;display:flex;flex-direction:column;gap:20px}
.side .br{display:flex;align-items:center;gap:10px;padding:4px 12px;font-weight:700;font-size:16px}
.side nav{display:flex;flex-direction:column;gap:4px}
.side nav button{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-md);color:var(--body);text-align:left;font-size:15px}
.side nav button[aria-current=true]{background:var(--primary-surface);color:var(--primary);font-weight:600}
.op{margin-top:auto;display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:var(--r-md);padding:12px}
.av{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.main{min-width:0;display:flex;flex-direction:column}
.hdr{height:72px;background:var(--canvas);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:space-between;padding-inline:28px;gap:12px}
.hdr .crumb{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sr{display:flex;align-items:center;gap:8px;border:1px solid var(--hairline);background:var(--hover);border-radius:var(--r-md);padding:0 14px;height:40px;width:300px;color:var(--muted-soft)}
.hdr .sr input{border:0;background:none;outline:0;flex:1;min-width:0;font-size:13px}
.pagec{padding:28px;display:flex;flex-direction:column;gap:20px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.ph h1{font-size:28px;line-height:1.4}
.ab{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:var(--r-md);font-weight:600;font-size:13px;border:1px solid var(--border);background:var(--canvas)}
.ab.p{background:var(--primary);border-color:var(--primary);color:#fff}.ab.d{background:var(--danger);border-color:var(--danger);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:16px}
.kpi{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-subtle);display:flex;flex-direction:column;gap:4px}
.kpi b{font-size:28px;line-height:1.4}.kpi .d{font-size:12px;font-weight:600;color:var(--success-text)}.kpi .d.n{color:var(--danger)}
.pn{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-subtle);min-width:0}
.cols2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.bars{display:flex;align-items:flex-end;gap:8px;height:200px;padding-top:12px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:11px;color:var(--muted)}
.bars i{width:100%;max-width:28px;border-radius:99px;background:var(--primary-surface)}.bars i.on{background:var(--primary)}
.fun{display:flex;flex-direction:column;gap:6px;font-size:13px}.fun .l{display:flex;justify-content:space-between}
.tw{overflow-x:auto;border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--canvas)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:13px}
th{background:var(--soft);color:var(--muted);font-weight:500;text-align:left;padding:14px 16px;white-space:nowrap}
td{padding:14px 16px;border-top:1px solid var(--hairline);white-space:nowrap}
tbody tr{cursor:pointer;transition:background .12s}tbody tr:hover{background:var(--hover)}
.bd2{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600}
.bd2::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.bd2.ok{background:var(--success-surface);color:var(--success-text)}.bd2.wn{background:var(--caution-surface);color:var(--caution-text)}
.bd2.er{background:var(--danger-surface);color:var(--danger)}.bd2.in{background:var(--primary-surface);color:var(--primary)}.bd2.nu{background:var(--soft);color:var(--body)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters .f{border:1px solid var(--border);background:var(--canvas);border-radius:var(--r-md);padding:9px 14px;font-size:13px;display:flex;gap:8px;align-items:center}
.filters .f input{border:0;outline:0;background:none;min-width:140px}
.modal{position:fixed;inset:0;background:rgba(13,18,26,.5);display:none;place-items:center;z-index:50;padding:16px}
.modal.open{display:grid}
.dlg{background:var(--canvas);border-radius:var(--r-xl);box-shadow:var(--shadow-float);width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:28px;display:flex;flex-direction:column;gap:16px}
.rw{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--hairline);font-size:13px}.rw span:first-child{color:var(--muted)}
.steps{display:flex;gap:8px;flex-wrap:wrap}.steps button{padding:8px 14px;border-radius:99px;background:var(--soft);color:var(--muted);font-weight:600;font-size:13px}.steps button[aria-selected=true]{background:var(--primary);color:#fff}
.login{width:100%;display:grid;grid-template-columns:1fr 1fr;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--shadow-float);max-width:980px;margin:min(80px,6vh) auto}
.login>div{padding:44px;display:flex;flex-direction:column;gap:20px}
.login .l{background:var(--ink);color:#fff}
@media(max-width:900px){.admin{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto;padding:12px;align-items:center;border-right:0;border-bottom:1px solid var(--hairline);gap:8px}.side .br{white-space:nowrap}.side nav{flex-direction:row}.side nav button{white-space:nowrap;padding:10px 12px}.op{display:none}.cols2{grid-template-columns:1fr}.hdr .sr{display:none}.pagec{padding:20px 16px}.login{grid-template-columns:1fr}.login>div{padding:28px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="shell">
  <header class="bar">
    <div class="brand"><span class="logo" id="logoI"></span>KETSUP <span class="muted" style="font-weight:500;font-size:13px">Hi-fi 데모</span></div>
    <div class="seg" role="group" aria-label="데모 영역"><button id="bUser" aria-pressed="true">사용자 앱</button><button id="bAdmin" aria-pressed="false">어드민 콘솔</button></div>
    <select id="jump" aria-label="화면 바로가기"></select>
    <button class="ghost" id="restart">처음부터</button>
  </header>
  <main id="stage"></main>
  <p class="note">디자인 토큰·화면 구성은 Figma Hi-fi 시안과 동일합니다. 데이터는 모두 예시입니다.</p>
</div>

book:'<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v15H5.5A1.5 1.5 0 0 0 4 20.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v15h5.5a1.5 1.5 0 0 1 1.5 1.5z"/>',
chat:'<path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-6l-4.5 3.5V17H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/>',
